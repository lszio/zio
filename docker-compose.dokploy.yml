# Dokploy stacks `zio` and `zio-dev` deploy this file; their domain upstream
# must point at the `site` service (was `zio`).
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
  grove:
    build:
      context: .
      dockerfile: Dockerfile.groiz
    restart: unless-stopped
    environment:
      GROIZ_ROOT: /srv/grove/data
      GROIZ_BIND: 0.0.0.0:8787
      GROIZ_WORKERS: "2"
      GROIZ_TENSOR_PYTHON: /opt/grove-venv/bin/python
      GROIZ_TOKEN_READER: ${GROIZ_TOKEN_READER}
      GROIZ_TOKEN_OPERATOR: ${GROIZ_TOKEN_OPERATOR}
      GROIZ_TOKEN_PUBLISHER: ${GROIZ_TOKEN_PUBLISHER}
      GROIZ_TOKEN_ANNOTATOR: ${GROIZ_TOKEN_ANNOTATOR}
    expose:
      - "8787"
    volumes:
      - grove-data:/srv/grove/data
    # Health lives in Dockerfile.groiz's HEALTHCHECK; a second definition
    # here would drift from the image's.
    # Training needs user namespaces; Docker's default seccomp makes
    # unshare(CLONE_NEWUSER) fail with EPERM. Lifting only the seccomp
    # filter (verified: probe passes, no extra capabilities granted) is
    # narrower than privileged or cap-add SYS_ADMIN.
    security_opt:
      - seccomp:unconfined

volumes:
  grove-data:
