[package]
name = "zio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Zio language core: reader, evaluator, ZOS object system, and the self-hosted compiler and instruction runtime"
readme = "../../README.md"
keywords = ["language", "compiler", "lisp", "self-hosting"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
im = "15.1.0"
itertools = "0.12.0"
parking_lot = "0.12"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "Window", "HtmlElement", "console"] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "zio_bench"
harness = false