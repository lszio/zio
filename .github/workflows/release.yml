name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Build everything but publish nothing"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 134217728

permissions:
  contents: write

jobs:
  plan:
    name: resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      # GitHub expressions need the `${{ }}` form inside an `if:`; a bare
      # `inputs.dry_run == true` compares two literals and is always
      # false, which would make a dry run publish for real.
      dry_run: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag that disagrees with the workspace version produces a
      # release whose binaries announce the wrong version. That is a
      # silent wrong answer, so it stops the build instead.
      - name: Check the tag against the workspace version
        id: decide
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${tag#refs/tags/}" != "$tag" ]; then tag="${tag#refs/tags/}"; fi
          version="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          echo "tag=$tag version=$version"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Self-hosting contracts
        run: cargo test -p zio-core --test self_hosting
      - name: Language server session
        run: |
          cargo build -p zio-lsp
          python3 tools/lsp_probe.py target/debug/zio-lsp

  native:
    name: ${{ matrix.target }}
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: zio-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: zio-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zio-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            archive: zio-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zio-windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p zio-cli -p zio-lsp --target ${{ matrix.target }}

      - name: Assemble the distribution
        shell: bash
        run: ./tools/install.sh "dist/${{ matrix.archive }}"
        env:
          ZIO_PROFILE: release
          # The installer builds FOR this triple and installs from
          # target/<triple>/release. Without it the archives would carry
          # whichever binary the runner's host triple produced.
          ZIO_TARGET: ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows*) zip -r "${{ matrix.archive }}.zip" "${{ matrix.archive }}" ;;
            *) tar -czf "${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}" ;;
          esac
          sha256sum "${{ matrix.archive }}".* > "${{ matrix.archive }}.sha256" \
            || shasum -a 256 "${{ matrix.archive }}".* > "${{ matrix.archive }}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: zio-${{ matrix.archive }}
          path: |
            dist/${{ matrix.archive }}.*
          if-no-files-found: error

  crates:
    name: publish crates
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: publish
          # Dependency order, and every package of the published library
          # family. zio-core first — every other crate resolves it from
          # the registry once it is there — and zio-cli last, since it
          # depends on the others. `loom` is deliberately absent: the
          # name is taken on crates.io and its in-repo consumers depend
          # on it by that path, so the crate sets `publish = false`.
          #
          # This step is strict on purpose. A silently failed publish is
          # a release that claims Rust libraries it never delivered, so a
          # failure stops the release rather than warning about it.
          args: >-
            --package zio-core
            --package zio-js
            --package zio-host
            --package zio-lsp
            --package zio-wasi
            --package zio-cli
            --token ${{ secrets.CRATES_TOKEN }}

  npm:
    name: publish npm wasm package
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build the browser engine
        run: ./tools/build-wasm.sh
      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          cp npm/package.json dist/npm/
          cp npm/README.md dist/npm/
          cp apps/site/public/wasm/zio_core.js \
             apps/site/public/wasm/zio_core.d.ts \
             apps/site/public/wasm/zio_core_bg.wasm \
             apps/site/public/wasm/zio_core_bg.wasm.d.ts dist/npm/
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/npm/package.json', 'utf8'));
            pkg.version = '${{ needs.plan.outputs.version }}';
            fs.writeFileSync('dist/npm/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: npm publish --access public
        working-directory: dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-cli:
    name: publish npm cli package
    needs: [plan, verify, native]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p dist/npm-cli
          cp npm/zio/package.json npm/zio/README.md \
             npm/zio/install.js dist/npm-cli/
          cp -R npm/zio/bin dist/npm-cli/bin
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/npm-cli/package.json', 'utf8'));
            pkg.version = '${{ needs.plan.outputs.version }}';
            fs.writeFileSync('dist/npm-cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node --check dist/npm-cli/install.js
          node --check dist/npm-cli/bin/zio.js
          node --check dist/npm-cli/bin/zio-lsp.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: npm publish --access public
        working-directory: dist/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: docker image
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lszio/zio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(needs.plan.outputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.zio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: github release
    needs: [plan, verify, native]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble the WASM payload
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: ./tools/build-wasm.sh
      - name: Stage everything
        run: |
          set -euo pipefail
          mkdir -p dist/zio-wasm
          cp -R apps/site/public/wasm/. dist/zio-wasm/
          echo "wasm:" > dist/zio-wasm/NOTICE.txt
          ls dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Zio ${{ needs.plan.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/zio-wasm/**
