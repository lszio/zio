name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Build everything but publish nothing"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 134217728

permissions:
  contents: write

jobs:
  plan:
    name: resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      # GitHub expressions need the `${{ }}` form inside an `if:`; a bare
      # `inputs.dry_run == true` compares two literals and is always
      # false, which would make a dry run publish for real.
      dry_run: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag that disagrees with the workspace version produces a
      # release whose binaries announce the wrong version. That is a
      # silent wrong answer, so it stops the build instead.
      - name: Check the tag against the workspace version
        id: decide
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${tag#refs/tags/}" != "$tag" ]; then tag="${tag#refs/tags/}"; fi
          version="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          echo "tag=$tag version=$version"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Self-hosting contracts
        run: cargo test -p zio-core --test self_hosting
      - name: Language server session
        run: |
          cargo build -p zio-lsp
          python3 tools/lsp_probe.py target/debug/zio-lsp

  native:
    name: ${{ matrix.target }}
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: zio-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: zio-linux-aarch64
          # macOS and Windows are absent because zio-host does not
          # compile for them: its restricted-process and filesystem
          # mechanisms are Linux implementations of the boundary, not
          # portable ones. An archive for a platform the crate cannot
          # build for would be a claim, and a stub boundary would be a
          # worse one, so the gap is named here and in docs/release.md
          # instead of being papered over with a target that fails.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p zio-cli -p zio-lsp --target ${{ matrix.target }}

      - name: Assemble the distribution
        shell: bash
        run: ./tools/install.sh "dist/${{ matrix.archive }}"
        env:
          ZIO_PROFILE: release
          # The installer builds FOR this triple and installs from
          # target/<triple>/release. Without it the archives would carry
          # whichever binary the runner's host triple produced.
          ZIO_TARGET: ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows*) archive="${{ matrix.archive }}.zip"; zip -r "$archive" "${{ matrix.archive }}" ;;
            *) archive="${{ matrix.archive }}.tar.gz"; tar -czf "$archive" "${{ matrix.archive }}" ;;
          esac
          # The checksum file is named after the archive it covers, so the
          # name a client builds is the name that exists. The npm CLI
          # fetches `<archive>.sha256`; a short `zio-linux-x86_64.sha256`
          # beside a `zio-linux-x86_64.tar.gz` is the same bytes under a
          # name nobody asks for, and 0.2.0 shipped exactly that.
          sha256sum "$archive" > "$archive.sha256" \
            || shasum -a 256 "$archive" > "$archive.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: zio-${{ matrix.archive }}
          path: |
            dist/${{ matrix.archive }}.*
          if-no-files-found: error

  crates:
    name: publish crates
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Dependency order, and every package of the published library
      # family. zio-core first — every other crate resolves it from the
      # registry once it is there — and zio-cli last, since it depends on
      # the others. `loom` is deliberately absent: the name is taken on
      # crates.io and its in-repo consumers depend on it by that path, so
      # the crate sets `publish = false`.
      #
      # One package per step, because a release is re-run: crates.io
      # rate-limits new crates (the first attempt at 0.2.0 published five
      # and was refused the sixth with a 429), and `cargo publish` of a
      # version already on the registry is an error rather than a no-op.
      # So "already uploaded" is a skip, a rate limit is waited out, and
      # anything else fails the job — a release must not quietly omit a
      # library it claimed.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in zio-core zio-js zio-host zio-lsp zio-wasi zio-cli; do
            for attempt in 1 2 3 4 5; do
              if out="$(cargo publish --package "$pkg" 2>&1)"; then
                echo "$pkg published"
                break
              fi
              printf '%s\n' "$out"
              case "$out" in
                *"already uploaded"*|*"already exists"*)
                  echo "$pkg is already at this version; nothing to publish"
                  break ;;
                *"Too Many Requests"*|*"status 429"*)
                  echo "$pkg rate limited; waiting five minutes (attempt $attempt)"
                  sleep 300 ;;
                *)
                  echo "$pkg failed to publish" >&2
                  exit 1 ;;
              esac
              if [ "$attempt" = 5 ]; then
                echo "$pkg did not publish within the retry budget" >&2
                exit 1
              fi
            done
          done

  npm:
    name: publish npm wasm package
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build the browser engine
        run: ./tools/build-wasm.sh
      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          cp npm/package.json dist/npm/
          cp npm/README.md dist/npm/
          cp apps/site/public/wasm/zio_core.js \
             apps/site/public/wasm/zio_core.d.ts \
             apps/site/public/wasm/zio_core_bg.wasm \
             apps/site/public/wasm/zio_core_bg.wasm.d.ts dist/npm/
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/npm/package.json', 'utf8'));
            pkg.version = '${{ needs.plan.outputs.version }}';
            fs.writeFileSync('dist/npm/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        working-directory: dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A version is immutable on npm, and a re-run of a release reaches
        # this step with the package already uploaded: publishing again is
        # a 403, not a no-op, and the release would be red for a reason
        # that is not a defect.
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do"
          else
            npm publish --access public
          fi

  npm-cli:
    name: publish npm cli package
    needs: [plan, verify, native]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p dist/npm-cli
          cp npm/zio/package.json npm/zio/README.md \
             npm/zio/install.js dist/npm-cli/
          cp -R npm/zio/bin dist/npm-cli/bin
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/npm-cli/package.json', 'utf8'));
            pkg.version = '${{ needs.plan.outputs.version }}';
            fs.writeFileSync('dist/npm-cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node --check dist/npm-cli/install.js
          node --check dist/npm-cli/bin/zio.js
          node --check dist/npm-cli/bin/zio-lsp.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        working-directory: dist/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do"
          else
            npm publish --access public
          fi

  docker:
    name: docker image
    needs: [plan, verify]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The gha cache export needs the docker-container driver; the default
      # docker driver refuses it outright ("Cache export is not supported
      # for the docker driver"), which is how the first attempt at 0.2.0
      # failed this job.
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lszio/zio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(needs.plan.outputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.zio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: github release
    needs: [plan, verify, native]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble the WASM payload
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: ./tools/build-wasm.sh
      - name: Stage everything
        run: |
          set -euo pipefail
          mkdir -p dist/zio-wasm
          cp -R apps/site/public/wasm/. dist/zio-wasm/
          echo "wasm:" > dist/zio-wasm/NOTICE.txt
          ls dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Zio ${{ needs.plan.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/zio-wasm/**
