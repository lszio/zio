[package]
name = "grove"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Existing native Grove implementation retained during the language-first refactor."

[dependencies]
zio-core = { path = "../../../../langs/core" }
loom = { path = "../../../../contribs/native/loom", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
loom = { path = "../../../../contribs/native/loom", features = ["http"] }
serde_json = "1"

[features]
default = []
teacher-http = ["dep:loom"]
