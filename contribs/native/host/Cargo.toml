[package]
name = "zio-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generic platform and tensor mechanisms for Zio programs, granted explicitly by the embedding process"
readme = "../../README.md"
keywords = ["language", "runtime", "bindings"]

[dependencies]
zio-core = { path = "../../../langs/core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
parking_lot = "0.12"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
