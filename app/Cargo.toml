[package]
name = "grove-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Independent Grove application: modular self-learning and logic evolution, reusing Zio and trusted host contracts; the new agent review workflow remains planned."

[lib]
path = "src/lib.rs"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
grove = { path = "../learning" }
zio-core = { path = "../core" }
# The agent host drives a model through Loom's structured session, so
# the dependency is real rather than test-only. The `http` transport
# stays optional and is selected by the feature below.
loom = { path = "../loom" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"], optional = true }

[features]
default = []
# The HTTP product surface (W10) is optional: the library, CLI and demo
# never need a network stack, and a build without it still passes.
# `model-http` is separate because a caller that only replays
# recordings must not pull in a network client.
http = ["dep:axum", "dep:tokio", "loom/http"]
model-http = ["loom/http"]

[dev-dependencies]
loom = { path = "../loom", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
ureq = { version = "2", features = ["json"] }
