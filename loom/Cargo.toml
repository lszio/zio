[package]
name = "loom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loom — the official standalone harness library for zio: structured model/tool contracts, sessions, budgets, cancellation, and transports. Not a language component; Grove injects its own evaluation and approval policy."

[dependencies]
zio-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ureq = { version = "2", features = ["json"], optional = true }

[features]
default = []
http = ["dep:ureq"]
