server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # landing redirects into site/ (the Astro build is served under /site/)
    location = / { return 302 /site/; }

    location /site/ {
        # Astro emits /site/agent/ and /site/grove/ directories, so the
        # existing-directory check resolves the subpages; no SPA fallback
        # (a wrong path must 404 rather than silently serve the landing page).
        try_files $uri $uri/ =404;

        # Hashed build assets are immutable; the wasm bundle is NOT (it is
        # rebuilt with the engine, and a stale one silently runs old code).
        location /site/_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /site/wasm/ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }

    # raw text assets: markdown docs and zio example scripts
    location ~* \.(md|zio|tsv)$ {
        types { } default_type text/plain;
        charset utf-8;
    }
}
