server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Astro owns the root: / is the landing page, /grove and /agent are real
    # routes emitted as directories. No /site prefix — the old layout forced
    # visitors through /site/ and left /grove at a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets are immutable; the wasm bundle is NOT (it is
    # rebuilt with the engine, and a stale one silently runs old code).
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /wasm/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # raw text assets: markdown docs and zio example scripts
    location ~* \.(md|zio|tsv)$ {
        types { } default_type text/plain;
        charset utf-8;
    }

    # Grove control plane. One origin, no CORS: the browser talks to
    # /api/* on the same host that served this page.
    location = /grove/app {
        return 301 /grove/app/;
    }
    # ^~ keeps the .md/.zio/.tsv regex below from shadowing these prefixes
    # when the tail of the path looks like a file (dots are legal in run ids).
    location ^~ /grove/app/ {
        proxy_pass http://grove:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
    location ^~ /api/ {
        proxy_pass http://grove:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}
