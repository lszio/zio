server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # landing redirects into site/ (index.html links ../docs, ../examples)
    location = / { return 302 /site/; }

    location /site/ {
        try_files $uri $uri/ =404;
    }

    # raw text assets: markdown docs and zio example scripts
    location ~* \.(md|zio|tsv)$ {
        types { } default_type text/plain;
        charset utf-8;
    }
}
